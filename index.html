<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Glosa</title>
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glosa">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#f3f1ec; --page:#fbfaf7; --surface:#fff; --ink:#22201c; --muted:#7d786f; --line:#e5e1d8; --accent:#5b5fe0; --accent-soft:#e3e4fb; --fab:#5b5fe0; --danger:#d93025;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f13; --page:#0e0f13; --surface:#1a1c23; --ink:#e6e7ec; --muted:#9a9eae; --line:#2a2d38; --accent:#9aa0ff; --accent-soft:#2a2d5c; --fab:#6a6ee8; --danger:#ff6b60; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f13; --page:#0e0f13; --surface:#1a1c23; --ink:#e6e7ec; --muted:#9a9eae; --line:#2a2d38; --accent:#9aa0ff; --accent-soft:#2a2d5c; --fab:#6a6ee8; --danger:#ff6b60; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,"Samsung One","SamsungOne",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink);flex:none}
.icon:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon svg{width:24px;height:24px;fill:currentColor}
header,main{max-width:900px;margin:0 auto;padding-left:20px;padding-right:20px}
header{padding-top:10px;padding-bottom:28px}
.row1{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.acts{display:flex}
h1{margin:28px 0 0;font-size:38px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
.sub{color:var(--muted);font-size:14px;margin:2px 0 18px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:26px;padding:0 18px;height:50px}
.search svg{width:20px;height:20px;fill:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
main{padding-bottom:140px}
h2{font-size:13px;font-weight:500;color:var(--muted);margin:20px 6px 10px}
.group{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.note{all:unset;box-sizing:border-box;display:block;width:100%;padding:18px 24px 16px;cursor:pointer;background:var(--surface);border-radius:24px}
.note:hover{filter:brightness(.97)}
.note:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nt{display:flex;align-items:center;gap:8px}
.nt b{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn svg{width:16px;height:16px;fill:var(--accent);display:block}
.pv{color:var(--muted);font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font-size:12px;color:var(--muted);margin-top:8px}
.chk{display:flex;align-items:flex-start;gap:8px;padding:2px 0;font-size:15px}
.chk label{flex:none;display:grid;place-items:center;width:22px;height:22px;cursor:pointer}
input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin:0;display:grid;place-items:center;cursor:pointer;background:transparent;flex:none}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk span{overflow-wrap:anywhere;padding-top:1px}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.more,.prog{color:var(--muted);font-size:13px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:80px 16px}
.empty svg{width:88px;height:88px;fill:var(--line);display:block;margin:0 auto 10px}
.fabs{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:12}
.fab{width:64px;height:64px;border-radius:22px;border:0;background:var(--fab);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--fab) 45%,transparent)}
.fab svg{width:32px;height:32px}
.scrim{position:fixed;inset:0;z-index:20;visibility:hidden;opacity:0;transform:scale(.94);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;background:var(--page);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.open{visibility:visible;opacity:1;transform:none;transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet{width:100%;max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:2px;padding:8px 10px}
.top .st{flex:1;color:var(--muted);font-size:13px;text-align:center}
#title{border:0;background:none;outline:none;font-size:28px;font-weight:600;padding:8px 24px 4px;width:100%}
.content{overflow:auto;flex:1}
.page{position:relative;padding:6px 24px 48px;min-height:max(100%,var(--mh,0px))}
#body{width:100%;height:100%;min-height:50vh;border:0;background:none;outline:none;resize:none;font-size:17px;line-height:1.6}
.row{display:flex;align-items:flex-start;gap:6px}
.row input[type=text]{flex:1;border:0;background:none;outline:none;padding:5px 0;font-size:17px}
.row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.row .x{width:32px;height:32px;opacity:0;color:var(--muted)}
.row:hover .x,.row .x:focus-visible{opacity:1}
@media (hover:none){.row .x{opacity:1}}
.row .x svg{width:18px;height:18px}
.row label{width:30px;height:30px;display:grid;place-items:center;flex:none}
.addrow{display:flex;align-items:center;gap:8px;color:var(--muted);padding:8px 0;border:0;background:none;width:100%;text-align:left;font-size:16px}
.addrow svg{width:20px;height:20px;fill:currentColor;margin:0 5px}
.sep{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);margin:10px 0 6px;padding-top:8px;color:var(--muted);font-size:13px}
.menu{position:fixed;z-index:30;background:var(--surface);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:8px;display:none;min-width:200px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-radius:12px}
.menu button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
#pin{color:var(--muted)}
#pin.on{background:var(--accent-soft);color:var(--accent)}
.note{transition:transform .15s,filter .15s}
.note:active{transform:scale(.985)}
.rt:empty:before{content:attr(data-ph);color:var(--muted)}
.rt h2{font-size:23px;margin:.3em 0}.rt ul{padding-left:24px;margin:.3em 0}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.tb{border:0;background:none;min-width:42px;height:40px;border-radius:12px;padding:0 12px;font-weight:500;white-space:nowrap;display:grid;place-items:center}
.tb[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.swatch{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);background:var(--sw);margin:0 3px}
.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.dot{display:block;border-radius:50%;background:currentColor}
html{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.content{overscroll-behavior:contain}
@media (max-width:600px){
  header,main{padding-left:16px;padding-right:16px}
  h1{font-size:32px;margin-top:20px}
  .note{padding:16px 20px 14px}
  #title{font-size:24px;padding:6px 18px 2px}
  .page{padding:4px 18px 48px}
  .top{padding:6px}
}
.tools{display:flex;gap:6px;align-items:center;overflow-x:auto;overscroll-behavior:contain;padding:8px 12px 10px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:var(--page);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:none;padding-right:8px;border-right:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.grp:last-child{border:0;padding-right:0}
.gi{display:grid;place-items:center;width:30px;height:30px;flex:none;color:var(--muted)}
.gi svg{width:20px;height:20px;fill:currentColor}
@media (min-width:760px){.tools{flex-wrap:wrap;justify-content:center;overflow:visible}}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink)}
.mark{width:32px;height:30px;flex:none}
.wm{font-family:"Instrument Serif","Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:32px;line-height:1;letter-spacing:-.01em;padding-bottom:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand"><svg class="mark" viewBox="0 0 34 32" aria-hidden="true"><path d="M7 3v26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"/><path d="M13 17q3.5-7 7 0t7 0 7 0" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="wm">Glosa</span></div>
    <div class="acts">
    <button class="icon" id="theme" aria-label="Cambiar tema" title="Cambiar tema"><svg viewBox="0 0 24 24"><path id="themeIcon" d=""/></svg></button>
    <button class="icon" id="more" aria-label="Más opciones" title="Más opciones"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
    </div>
  </div>
  <h1>Notas</h1>
  <div class="sub" id="sub"></div>
  <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" type="search" placeholder="Buscar en las notas" aria-label="Buscar notas"></label>
</header>
<main><div id="view"></div></main>
<div class="fabs">
  <button class="fab" id="fab" title="Nueva nota" aria-label="Nueva nota"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="14.5" height="14.5" rx="3" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="1.7"/><path d="M7 8h7M7 11.5h3.5" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M10 21l.93-3.47 8.3-8.3 2.54 2.54-8.3 8.3z" fill="#fff" stroke="var(--fab)" stroke-width="1.6"/></svg></button>
</div>
<div class="scrim" id="scrim">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Editar nota">
    <div class="top">
      <button class="icon" id="close" title="Volver" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <span class="st" id="st"></span>
      <button class="icon" id="pin" title="Fijar" aria-label="Fijar nota"><svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>
      <button class="icon" id="del" title="Eliminar" aria-label="Eliminar nota"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
    </div>
    <input id="title" placeholder="Título" aria-label="Título">
    <div class="content" id="scroll"><div class="page" id="page"><div id="content"></div><canvas id="ink" aria-label="Dibujo"></canvas></div></div>
    <div class="tools" id="tools" role="toolbar" aria-label="Herramientas"></div>
  </div>
</div>
<div class="menu" id="menu"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
(function(){
  var KEY="bloc-notas-v1", TKEY="bloc-notas-tema";
  var notes=[], cur=null, timer=null, filter="all", stash={}, $=function(i){return document.getElementById(i)};

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function load(){
    try{var r=localStorage.getItem(KEY);notes=r?JSON.parse(r):[];if(!Array.isArray(notes))notes=[]}catch(e){notes=[]}
    notes=notes.map(function(n){return{id:n.id||uid(),title:n.title||"",type:"text",body:n.type==="list"?(n.items||[]).map(function(i){return i.text}).filter(Boolean).join("\n"):(n.body||""),items:[],color:n.color||0,pinned:!!n.pinned,strokes:n.strokes||[],html:n.type==="list"||n.html==null?null:n.html,pinnedAt:n.pinnedAt||(n.pinned?(n.updated||0):0),updated:n.updated||Date.now()}});
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(notes));$("st").textContent="Guardado en este dispositivo"}
    catch(e){$("st").textContent="No se pudo guardar: el navegador bloquea el almacenamiento"}
  }
  function find(id){return notes.filter(function(n){return n.id===id})[0]}
  function isEmpty(n){return !(n.strokes&&n.strokes.length)&&!n.title.trim()&&!n.body.trim()&&!n.items.some(function(i){return i.text.trim()})}
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
  function svg(d){return '<svg viewBox="0 0 24 24"><path d="'+d+'"/></svg>'}
  var PIN="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z";
  var XI="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z";

  function schedule(){
    cur&&(cur.updated=Date.now());
    $("st").textContent="Guardando…";
    clearTimeout(timer);timer=setTimeout(function(){save();renderGrid()},300);
  }

  /* ---------- Tarjetas ---------- */
  function card(n){
    var c=el("button","note");c.type="button";
    var t=el("div","nt");t.appendChild(el("b","",n.title||"Sin título"));
    if(n.pinned){var p=el("span","pn");p.innerHTML=svg(PIN);t.appendChild(p)}
    c.appendChild(t);
    var pv;
    if(n.type==="list"){
      var d=n.items.filter(function(i){return i.done}).length,f=n.items.filter(function(i){return i.text.trim()})[0];
      pv=(f?f.text:"Lista vacía")+(n.items.length?" ("+d+"/"+n.items.length+")":"");
    }else pv=n.body.split("\n").filter(Boolean).join(" ")||(n.strokes&&n.strokes.length?"Dibujo":"Sin texto");
    c.appendChild(el("div","pv",pv));
    var dt=new Date(n.updated);
    c.appendChild(el("div","date",dt.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+", "+dt.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})));
    c.onclick=function(){var r=c.getBoundingClientRect();$("scrim").style.transformOrigin=(r.left+r.width/2)+"px "+(r.top+r.height/2)+"px";openNote(n.id)};
    return c;
  }
  function rowView(n,i){
    var r=el("div","chk"+(i.done?" done":"")),l=el("label"),cb=document.createElement("input");
    cb.type="checkbox";cb.checked=i.done;cb.setAttribute("aria-label",i.text||"Elemento");
    cb.onclick=function(e){e.stopPropagation()};l.onclick=function(e){e.stopPropagation()};
    cb.onchange=function(){i.done=cb.checked;n.updated=Date.now();save();renderGrid()};
    l.appendChild(cb);r.appendChild(l);r.appendChild(el("span","",i.text));return r;
  }
  function renderGrid(){
    var v=$("view"),t=$("q").value.trim().toLowerCase();v.innerHTML="";$("sub").textContent=notes.length+(notes.length===1?" nota":" notas");
    var list=notes.filter(function(n){
      if(filter==="list"&&n.type!=="list")return false;
      if(filter==="pinned"&&!n.pinned)return false;
      if(!t)return true;
      return (n.title+" "+n.body+" "+n.items.map(function(i){return i.text}).join(" ")).toLowerCase().indexOf(t)>-1;
    }).sort(function(a,b){return b.updated-a.updated});
    if(!list.length){
      var e=el("div","empty");
      e.innerHTML=svg("M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z");
      e.appendChild(el("div","",t?"Ninguna nota coincide con la búsqueda.":"Las notas que añadas aparecerán aquí."));
      v.appendChild(e);return;
    }
    var pinned=list.filter(function(n){return n.pinned}),rest=list.filter(function(n){return !n.pinned});
    pinned.sort(function(a,b){return (b.pinnedAt||0)-(a.pinnedAt||0)});
    [["Fijadas",pinned],[pinned.length?"Otras":"",rest]].forEach(function(s){
      if(!s[1].length)return;
      if(s[0])v.appendChild(el("h2","",s[0]));
      var g=el("div","group");s[1].forEach(function(n){g.appendChild(card(n))});v.appendChild(g);
    });
  }

  /* ---------- Editor ---------- */
  function newNote(type){
    var n={id:uid(),title:"",type:type,body:"",items:type==="list"?[{id:uid(),text:"",done:false}]:[],color:0,pinned:false,updated:Date.now()};
    notes.push(n);openNote(n.id,true);
  }
  function openNote(id,focus){
    cur=find(id);if(!cur)return;
    $("title").value=cur.title;$("scrim").classList.add("open");
    renderContent(focus);setDraw(false);syncBtns();requestAnimationFrame(fit);
    $("st").textContent="Guardado en este dispositivo";
    if(focus&&cur.type==="text")$("title").focus();
  }
  function syncBtns(){
    $("pin").classList.toggle("on",cur.pinned);$("pin").setAttribute("aria-pressed",String(cur.pinned));
    $("pin").title=cur.pinned?"Desfijar nota":"Fijar nota";$("pin").setAttribute("aria-label",$("pin").title);
  }
  function renderContent(focus){
    var c=$("content");c.innerHTML="";
    if(cur.type==="text"){
      var ed=el("div","rt");ed.id="body";ed.contentEditable="true";ed.setAttribute("role","textbox");ed.setAttribute("aria-multiline","true");ed.setAttribute("aria-label","Contenido");ed.setAttribute("data-ph","Escribe una nota…");
      ed.innerHTML=cur.html!=null?clean(cur.html):esc(cur.body).replace(/\n/g,"<br>");
      ed.oninput=function(){cur.html=ed.innerHTML;cur.body=ed.innerText;schedule()};
      ed.onpaste=function(e){e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text"))};
      c.appendChild(ed);if(focus)setTimeout(function(){ed.focus()},0);return;
    }
  }
  function closeNote(){
    clearTimeout(timer);
    if(cur&&isEmpty(cur))notes=notes.filter(function(n){return n!==cur});
    else if(cur)cur.updated=Date.now();
    save();cur=null;$("scrim").classList.remove("open");renderGrid();
  }

  $("title").oninput=function(){cur.title=$("title").value;schedule()};
  $("pin").onclick=function(){cur.pinned=!cur.pinned;cur.pinnedAt=cur.pinned?Date.now():0;syncBtns();schedule()};
  $("del").onclick=function(){
    if(!confirm("¿Eliminar esta nota? No se puede deshacer."))return;
    notes=notes.filter(function(n){return n!==cur});cur=null;save();$("scrim").classList.remove("open");renderGrid();
  };
  $("close").onclick=closeNote;
  $("scrim").onmousedown=function(e){if(e.target===$("scrim"))closeNote()};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeNote()});
  $("q").oninput=renderGrid;
